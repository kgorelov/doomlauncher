[gzdoom]
type = "engine"
title = "GZDoom"
binary = "gzdoom"
binaries = ["gzdoom"]
capabilities = ["vanilla", "limit-removing", "boom", "mbf", "mbf21", "zdoom", "gzdoom", "pk3", "udmf"]
cmd = "{{BIN}} -iwad {{IWAD}}{% if PWADS %}{% for wad in PWADS %} -file {{wad}}{% endfor %}{% endif %} -savedir {{SAVEDIR}}"
